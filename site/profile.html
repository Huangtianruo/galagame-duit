<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 · 我的 3D 形象</title>
<style>
:root{--paper:#f9f7f2;--card:#fffdf9;--ink:#263d33;--muted:#637065;--line:#d8dacf;--green:#294e3d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.52;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ac6449;outline-offset:3px}h1,h2,p{margin:0}.shell{max-width:1450px;margin:auto;padding:17px clamp(18px,4vw,54px) 24px}nav,.head,.cardtop,.tools,.fillrow,.swatches{display:flex;align-items:center;justify-content:space-between;gap:10px}nav{border-bottom:1px solid var(--line);padding-bottom:13px}.brand{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px}.brand b{color:var(--green);font:italic bold 31px Georgia,serif;letter-spacing:-2px}.brand span{border-left:1px solid var(--line);padding-left:16px}.back,.light,.switch button,.toggle{border:1px solid var(--line);border-radius:7px;background:transparent;padding:7px 12px;font-size:13px}.head{margin:21px 0}.head h1{font:600 clamp(32px,3.6vw,48px)/1.16 "Songti SC",SimSun,serif;letter-spacing:.03em}.head p,.note{font-size:13px;color:var(--muted);margin-top:7px}.main{display:grid;grid-template-columns:minmax(320px,1.6fr) minmax(300px,.9fr);gap:18px}.stage{position:relative;min-height:540px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 52% 37%,#f8f0e5,#e4d6c8 60%,#d6c7b7);border:1px solid #d6c8ba}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.tools{position:absolute;inset:15px 17px auto;z-index:1}.switch{background:#fffaf0de;display:inline-flex;border:1px solid #cbbfaf;border-radius:8px;padding:3px}.switch button{border:0;padding:5px 12px}.switch button[aria-pressed=true]{background:var(--green);color:white}.previewState{background:#fffaf0dc;color:#655c51;padding:5px 10px;border-radius:5px;font-size:12px}.rule{position:absolute;left:24px;top:26%;bottom:22%;width:9px;background:repeating-linear-gradient(to bottom,#887b68 0 1px,transparent 1px 11px);border-left:1px solid #a59885;pointer-events:none}.rule span{position:absolute;left:13px;top:0;white-space:nowrap;font:12px Consolas,monospace;color:#635c52}.foot{position:absolute;bottom:15px;left:17px;right:17px;display:flex;justify-content:space-between;align-items:end;gap:8px}.foot small{color:#625c52;font-size:12px}.foot strong{display:block;font:600 21px/1.6 SimSun,serif}.panel{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:18px 20px}.panel h2{font-size:16px}.section+.section{border-top:1px solid var(--line);margin-top:15px;padding-top:14px}.photo{width:100%;border:1px dashed #aeb8a5;border-radius:8px;background:#f5f6ef;display:flex;align-items:center;text-align:left;gap:13px;padding:10px;margin:10px 0 4px}.photo .thumb{width:44px;height:50px;background:#e3e8da;border-radius:6px;display:grid;place-items:center;overflow:hidden}.thumb svg{width:25px;height:25px;stroke:#547059;fill:none;stroke-width:1.4}.thumb img{width:100%;height:100%;object-fit:cover}.photo b,.photo small{display:block}.photo small,.caption,.status{font-size:12px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px 13px;margin:10px 0}.field{display:flex;flex-direction:column;gap:3px;font-size:13px}.field input,.field select{width:100%;padding:7px 8px;border:1px solid #bac1b8;border-radius:6px;background:#fffefa}.swatches{justify-content:flex-start;font-size:13px;margin-top:10px}.swatches input{width:32px;height:25px;cursor:pointer;background:transparent;border:1px solid #c2c8bc;padding:1px;border-radius:4px}.primary{border:0;background:var(--green);color:#fff;border-radius:7px;padding:10px 12px;font-weight:600}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions .light{font-weight:600;background:#f2f4ec}.status{min-height:18px;margin-top:7px}.status[data-error=true]{color:#a13c2b}.fillrow{justify-content:flex-start;flex-wrap:wrap}.text{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--green);font-size:12px;padding:3px 0}.footnote{margin:12px 0 0;font-size:12px;color:#667063}.stageMsg{position:absolute;top:48%;left:12%;right:12%;text-align:center;color:#664d41;background:#fff8;padding:8px}.file{position:absolute;width:1px;height:1px;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:760px){.shell{padding:12px}.main{grid-template-columns:1fr}.stage{min-height:370px}.head{margin:14px 0}.panel{padding:14px}.foot strong{font-size:18px}}
.thumb:has(img:not([hidden])) svg{display:none}
</style></head><body><main class="shell">
<nav><div class="brand"><b>duit</b><span>个人中心</span></div><a id="journalEntry" href="./project-records.html" target="_blank" rel="opener" style="margin-left:auto;margin-right:12px;color:#365841;text-underline-offset:3px;font-size:13px">Agent 工作记录 ↗</a><button id="back" class="back">← 返回房间</button></nav>
<header class="head"><div><h1>我的 3D 形象</h1><p>用正面自拍塑造面部，按你的身高制作可以在房间里行走的人物。</p></div></header>
<div class="main"><section class="stage" id="stage" aria-label="三维人物预览"><div class="tools"><div class="switch"><button id="full" aria-pressed="true">全身</button><button id="face" aria-pressed="false">面部</button></div><span class="previewState" id="kind">体型预览</span></div><div class="rule"><span id="ruler">170 cm</span></div><div id="stageMsg" class="stageMsg">正在准备预览…</div><div class="foot"><div><small>拖动旋转 · 滚轮缩放</small><strong id="previewName">我的形象</strong></div><button id="turn" class="toggle">转动预览</button></div></section>
<section class="panel"><div class="section"><div class="cardtop"><h2>正面自拍</h2></div>
<button class="photo" id="choose" type="button"><span class="thumb"><svg id="photoIcon" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg><img id="thumb" hidden alt="自拍预览"></span><span><b id="fileLabel">选择一张自拍</b><small>单人正脸，露出额头与下巴</small></span></button>
<input id="file" class="file" type="file" accept="image/jpeg,image/png,image/webp" tabindex="-1"><p class="caption">支持 JPG、PNG、WebP，最大 18 MB。</p></div>
<div class="section"><h2>人物信息</h2><div class="fields">
<label class="field">形象名称<input id="name" maxlength="24" value="我的形象"></label><label class="field">身高（厘米）<input id="height" type="number" min="60" max="230" step="0.5" value="170" required></label>
<label class="field">肩宽（厘米）<input id="width" type="number" min="22" max="65" step="0.5" value="41" required></label><label class="field">发型<select id="hair"><option value="short">短发</option><option value="bob">齐耳发</option><option value="none">不添加头发</option></select></label></div>
<div class="swatches"><label for="shirt">上衣</label><input id="shirt" type="color" value="#688475"><label for="trousers">长裤</label><input id="trousers" type="color" value="#434b55"><label for="hairColor">发色</label><input id="hairColor" type="color" value="#372e2b"></div></div>
<div class="section"><div class="actions"><button id="generate" class="light">生成 3D 人物</button><button id="use" class="primary" disabled>保存并进入房间</button></div><p id="status" class="status" role="status" aria-live="polite">先选一张自拍，再生成个人形象。</p><div class="fillrow"><button class="text" id="download" hidden>下载人物 GLB</button><button class="text" id="remove" hidden>移除本机形象</button></div></div></section></div>
<p class="footnote">自拍在本浏览器内处理。保存后，这台设备会保留含面部纹理的人物模型；原始照片不会上传。背面、发型和身体外形按参数补全。</p></main>
